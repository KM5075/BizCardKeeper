name: .NET Core アプリケーションを構築して Web アプリ BizCardKeeperServer にデプロイする
on:
  push:

env:
  AZURE_WEBAPP_NAME: BizCardKeeperServer
  AZURE_WEBAPP_PACKAGE_PATH: BizCardKeeper.Server\publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: BizCardKeeper.Server
  SERVER_TEST_DIRECTORY: BizCardKeeper.Server.Tests

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Client Side Test
        run: |
          cd .\BizcardKeeper.client\
          npm install
          npm i && npm run build --if-present
          npm test
      - name: Server Side Test
        run: dotnet test "${{ env.SERVER_TEST_DIRECTORY }}"
      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  e2eTest:
    # if: github.ref == 'refs/heads/master' # masterブランチのみデプロイ
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: |
          cd .\BizcardKeeper.client\
          npm ci
      - name: Install Playwright Browsers
        run: |
          cd .\BizcardKeeper.client\
          npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          cd .\BizcardKeeper.client\
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/master' # masterブランチのみデプロイ
    runs-on: windows-latest
    needs: [build, e2eTest]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run EF Core migrations
        run: |
          cd .\BizCardKeeper.Server\
          dotnet tool install --global dotnet-ef
          dotnet ef database update -c "ApplicationIdentityDbContext" --connection '${{ secrets.AZURE_SQL_CONNECTION_STRING2 }}'
          dotnet ef database update -c "BizCardKeeperDbContext" --connection '${{ secrets.AZURE_SQL_CONNECTION_STRING2 }}'
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
